<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1100" role="img" aria-label="WhatsApp chat placeholder">
  <rect width="640" height="1100" fill="#ece5dd"/>
  <!-- header -->
  <g transform="translate(0 0)">
    <rect width="640" height="80" fill="#075e54"/>
    <circle cx="80" cy="40" r="22" fill="#aed581"/>
    <text x="120" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Yasen Client</text>
  </g>
  <!-- incoming bubble 1 -->
  <g transform="translate(40 130)">
    <rect width="380" height="60" rx="10" fill="#ffffff"/>
    <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#222">Will check them out in a bit</text>
    <text x="360" y="52" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8d8d8d">5:39 PM</text>
  </g>
  <!-- incoming bubble 2 -->
  <g transform="translate(40 220)">
    <rect width="420" height="100" rx="10" fill="#ffffff"/>
    <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#222">They are free of spelling</text>
    <text x="20" y="64" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#222">mistakes I take it?</text>
    <text x="400" y="92" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8d8d8d">5:40 PM</text>
  </g>
  <!-- outgoing reply with quote -->
  <g transform="translate(170 350)">
    <rect width="430" height="130" rx="10" fill="#dcf8c6"/>
    <rect x="14" y="12" width="402" height="62" rx="6" fill="#cdebab"/>
    <rect x="14" y="12" width="4" height="62" fill="#d97757"/>
    <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#d97757">Yasen Client</text>
    <text x="28" y="56" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#3a3a3a">They are free of spelling mistakes I take it?</text>
    <text x="20" y="104" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#222">Yessir</text>
    <text x="410" y="120" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8d8d8d">5:40 PM ✓✓</text>
  </g>
  <!-- incoming "Great, thank you" -->
  <g transform="translate(40 510)">
    <rect width="280" height="60" rx="10" fill="#ffffff"/>
    <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#222">Great, thank you</text>
    <text x="260" y="52" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8d8d8d">5:40 PM</text>
  </g>
  <!-- heart sticker -->
  <g transform="translate(40 600)">
    <circle cx="40" cy="40" r="36" fill="#ffffff"/>
    <text x="40" y="54" text-anchor="middle" font-size="40">❤️</text>
  </g>
  <!-- incoming "Just watched them, exceptional work" -->
  <g transform="translate(40 700)">
    <rect width="500" height="120" rx="10" fill="#ffffff"/>
    <text x="20" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#222">Just watched them, exceptional</text>
    <text x="20" y="74" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#222">work</text>
    <text x="480" y="106" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8d8d8d">5:46 PM</text>
  </g>
  <!-- outgoing "Thanks" -->
  <g transform="translate(420 870)">
    <rect width="180" height="60" rx="10" fill="#dcf8c6"/>
    <text x="20" y="38" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#222">Thanks</text>
    <text x="160" y="52" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8d8d8d">5:46 ✓✓</text>
  </g>
  <text x="600" y="1080" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#9c9c9c">
    PLACEHOLDER · 3
  </text>
</svg>
